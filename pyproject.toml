[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rime-reranker"
version = "0.1.0"
description = "A conservative, local-only context reranker for Rime candidates"
requires-python = ">=3.10"

[project.optional-dependencies]
train = ["torch>=2.2", "numpy>=1.26", "PyYAML>=6", "zstandard>=0.22"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tinyrime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
