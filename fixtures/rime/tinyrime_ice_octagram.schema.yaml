schema:
  schema_id: tinyrime_ice_octagram
  name: TinyRime rime-ice plus Wanxiang octagram
  version: "0.1"
  author:
    - TinyRime contributors

switches:
  - name: ascii_mode
    reset: 0
    states: [中, A]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/

translator:
  dictionary: rime_ice
  enable_word_completion: true
  initial_quality: 1.2
  contextual_suggestions: true
  max_homophones: 8

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 3
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -20

recognizer:
  import_preset: default

key_binder:
  import_preset: default
